<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台語搶答拔河</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

  <header class="topBar">
    <a href="find.html" class="navLink navLinkLeft">📖 <span class="navLinkText">辭典查詢</span></a>
    <h1>台語搶答拔河</h1>
    <button type="button" id="themeToggle" title="切換深色/淺色模式" aria-label="切換深色/淺色模式">🌓</button>
  </header>

  <section id="settingsScreen">
    <p id="dictStatus">題庫載入中...</p>
    <form id="settingsForm">
      <fieldset class="segmented">
        <legend>遊戲模式</legend>
        <div class="options">
          <label><input type="radio" name="gameType" value="team"> 雙人搶答拔河</label>
          <label><input type="radio" name="gameType" value="solo" checked> 一人刷題(台語練習,積分永久累計)</label>
        </div>
      </fieldset>

      <div class="settingsCard">
        <div id="teamOnlyFields" hidden>
          <div class="field">
            <label for="targetScore">目標題數(N)</label>
            <input type="number" id="targetScore" value="5" min="1" max="50">
          </div>
          <div class="field">
            <label for="teamAName">A隊隊名</label>
            <input type="text" id="teamAName" value="紅隊">
          </div>
          <div class="field">
            <label for="teamBName">B隊隊名</label>
            <input type="text" id="teamBName" value="藍隊">
          </div>
        </div>

        <div class="field">
          <label for="questionSeconds">每題時限(秒)</label>
          <input type="number" id="questionSeconds" value="15" min="5" max="60">
        </div>
      </div>

      <div id="soloStatsBox">
        <p id="soloStatsText" class="hint"></p>
        <button type="button" id="resetSoloStatsBtn">清除累計紀錄</button>
      </div>

      <fieldset class="chipGroup">
        <legend>出題模式</legend>
        <p class="hint fieldHint">可複選,複選就是混合出題</p>
        <div class="options">
          <label><input type="checkbox" class="modeCheckbox" value="meaning" checked> 詞義(看台語詞,猜中文意思)</label>
          <label><input type="checkbox" class="modeCheckbox" value="romanization" checked> 漢字 ↔ 羅馬字</label>
          <label><input type="checkbox" class="modeCheckbox" value="tone"> 聲調(本調 / 連讀變調)</label>
          <label><input type="checkbox" class="modeCheckbox" value="animal-hanzi"> 動物(看圖猜台語漢字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="animal-roman"> 動物(看圖猜羅馬字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="body-hanzi"> 身體部位(含骨頭,看圖猜台語漢字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="body-roman"> 身體部位(含骨頭,看圖猜羅馬字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="plant-hanzi"> 樹仔/草仔(看圖猜台語漢字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="plant-roman"> 樹仔/草仔(看圖猜羅馬字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="vehicle-hanzi"> 工程車(看圖猜台語漢字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="vehicle-roman"> 工程車(看圖猜羅馬字)</label>
          <label><input type="checkbox" class="modeCheckbox" value="place"> 地名/溪流(台灣車站、山脈、溪流)</label>
          <label><input type="checkbox" class="modeCheckbox" value="multiplication"> 九九乘法(台語數字)</label>
        </div>
      </fieldset>

      <fieldset class="segmented">
        <legend>羅馬字系統</legend>
        <div class="options">
          <label><input type="radio" name="romanSystem" value="tailo" checked> 台羅拼音</label>
          <label><input type="radio" name="romanSystem" value="poj"> 白話字(POJ)</label>
        </div>
      </fieldset>

      <fieldset class="chipGroup">
        <legend>難易度</legend>
        <p class="hint fieldHint">可複選;只影響「詞義/羅馬字/聲調」這幾個查辭典的模式,
          動物、身體部位、樹仔/草仔、工程車、地名/溪流、九九乘法不受影響</p>
        <div class="options">
          <label><input type="checkbox" class="levelCheckbox" value="elementary" checked> 國小</label>
          <label><input type="checkbox" class="levelCheckbox" value="junior" checked> 國中</label>
          <label><input type="checkbox" class="levelCheckbox" value="senior" checked> 高中</label>
          <label><input type="checkbox" class="levelCheckbox" value="university" checked> 大學</label>
        </div>
        <p class="hint fieldHint">難易度是 AI 依字數與辭典釋義文字概略判斷的,不是教育部官方分級
          (教育部辭典本身沒有難易度資料),僅供參考。</p>
      </fieldset>

      <button type="submit" id="startBtn" disabled>開始練習</button>
    </form>
    <p class="hint" id="teamKeyHint" hidden>搶答鍵:A隊按 <kbd>D</kbd>、B隊按 <kbd>K</kbd>;作答按 <kbd>1</kbd>~<kbd>4</kbd>(畫面按鈕也可以點)</p>
    <p class="hint" id="soloKeyHint">作答按 <kbd>1</kbd>~<kbd>4</kbd>(畫面按鈕也可以點),答完自動出下一題</p>
  </section>

  <section id="gameScreen" hidden>
    <div id="arena">
      <div class="sidePanel" id="panelA">
        <div class="teamName"></div>
        <div class="teamScore"></div>
        <button class="buzzBtn" id="buzzBtnA">搶答(D)</button>
      </div>

      <div id="centerStage">
        <div id="timerBadge">⏱ <span id="timerNum">--</span></div>

        <svg id="tugScene" viewBox="0 0 400 150" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <line id="sceneGround" x1="10" y1="132" x2="390" y2="132"/>
          <line id="sceneCenterLine" x1="200" y1="18" x2="200" y2="132"/>
          <line id="ropeLine" x1="95" y1="78" x2="305" y2="78"/>

          <g transform="translate(70,78)">
            <g class="tugChar" id="charA">
              <path class="leg" d="M0,0 L-14,32"/>
              <path class="toe" d="M-14,32 L-20,39 M-14,32 L-14,41 M-14,32 L-8,39"/>
              <path class="leg" d="M0,0 L10,34"/>
              <path class="toe" d="M10,34 L4,41 M10,34 L10,43 M10,34 L16,41"/>
              <path class="body" d="M-3,0 C-21,-3 -25,-23 -20,-39 C-16,-53 -7,-60 -2,-60 C4,-60 14,-52 16,-39 C19,-24 15,-5 4,0 Z"/>
              <path class="arm armUp" d="M-9,-34 L-23,-44 L-29,-56"/>
              <path class="hand" d="M-29,-56 l-2,-6 M-29,-56 l-7,-2 M-29,-56 l-5,4"/>
              <path class="arm armPull" d="M-5,-32 L11,-18 L26,-6"/>
              <path class="hand" d="M26,-6 l5,-3 M26,-6 l6,1 M26,-6 l3,5"/>
              <circle class="face" cx="-2" cy="-38" r="15"/>
              <g class="eyesOpen">
                <circle class="eye" cx="-8" cy="-40" r="1.7"/>
                <circle class="eye" cx="4" cy="-40" r="1.7"/>
              </g>
              <g class="eyesClosed">
                <path class="eyeLine" d="M-10,-40 l4,0"/>
                <path class="eyeLine" d="M2,-40 l4,0"/>
              </g>
              <g class="eyesSurprised">
                <path class="eyeX" d="M-10,-42 l4,4 M-10,-38 l4,-4"/>
                <path class="eyeX" d="M2,-42 l4,4 M2,-38 l4,-4"/>
              </g>
              <path class="mouth" d="M-6,-31 Q-2,-27 2,-31"/>
              <path class="mouthOpen" d="M-5,-32 Q-2,-25 1,-32 Q-2,-29 -5,-32 Z"/>
              <path class="blush blushL" d="M-13,-34 l4,1.3 M-13,-31.5 l4,1"/>
              <path class="blush blushR" d="M11,-34 l-4,1.3 M11,-31.5 l-4,1"/>
            </g>
          </g>
          <g transform="translate(330,78) scale(-1,1)">
            <g class="tugChar" id="charB">
              <path class="leg" d="M0,0 L-14,32"/>
              <path class="toe" d="M-14,32 L-20,39 M-14,32 L-14,41 M-14,32 L-8,39"/>
              <path class="leg" d="M0,0 L10,34"/>
              <path class="toe" d="M10,34 L4,41 M10,34 L10,43 M10,34 L16,41"/>
              <path class="body" d="M-3,0 C-21,-3 -25,-23 -20,-39 C-16,-53 -7,-60 -2,-60 C4,-60 14,-52 16,-39 C19,-24 15,-5 4,0 Z"/>
              <path class="arm armUp" d="M-9,-34 L-23,-44 L-29,-56"/>
              <path class="hand" d="M-29,-56 l-2,-6 M-29,-56 l-7,-2 M-29,-56 l-5,4"/>
              <path class="arm armPull" d="M-5,-32 L11,-18 L26,-6"/>
              <path class="hand" d="M26,-6 l5,-3 M26,-6 l6,1 M26,-6 l3,5"/>
              <circle class="face" cx="-2" cy="-38" r="15"/>
              <g class="eyesOpen">
                <circle class="eye" cx="-8" cy="-40" r="1.7"/>
                <circle class="eye" cx="4" cy="-40" r="1.7"/>
              </g>
              <g class="eyesClosed">
                <path class="eyeLine" d="M-10,-40 l4,0"/>
                <path class="eyeLine" d="M2,-40 l4,0"/>
              </g>
              <g class="eyesSurprised">
                <path class="eyeX" d="M-10,-42 l4,4 M-10,-38 l4,-4"/>
                <path class="eyeX" d="M2,-42 l4,4 M2,-38 l4,-4"/>
              </g>
              <path class="mouth" d="M-6,-31 Q-2,-27 2,-31"/>
              <path class="mouthOpen" d="M-5,-32 Q-2,-25 1,-32 Q-2,-29 -5,-32 Z"/>
              <path class="blush blushL" d="M-13,-34 l4,1.3 M-13,-31.5 l4,1"/>
              <path class="blush blushR" d="M11,-34 l-4,1.3 M11,-31.5 l-4,1"/>
            </g>
          </g>

          <g id="ropeKnot">
            <circle r="8"/>
            <path class="flag" d="M0,-8 L14,-14 L0,-20 Z"/>
          </g>
        </svg>

        <div id="statusLine"></div>

        <div id="questionCard">
          <div id="promptLabel"></div>
          <div id="promptText"></div>
        </div>

        <div id="choices">
          <button class="choiceBtn" data-idx="0"><span class="choiceKey">1</span><span class="choiceText"></span></button>
          <button class="choiceBtn" data-idx="1"><span class="choiceKey">2</span><span class="choiceText"></span></button>
          <button class="choiceBtn" data-idx="2"><span class="choiceKey">3</span><span class="choiceText"></span></button>
          <button class="choiceBtn" data-idx="3"><span class="choiceKey">4</span><span class="choiceText"></span></button>
        </div>
      </div>

      <div class="sidePanel" id="panelB">
        <div class="teamName"></div>
        <div class="teamScore"></div>
        <button class="buzzBtn" id="buzzBtnB">搶答(K)</button>
      </div>
    </div>

    <button id="backBtn">回設定</button>
  </section>

  <section id="gameOverScreen" hidden>
    <h1 id="winnerText"></h1>
    <button id="playAgainBtn">再玩一次</button>
  </section>

  <section id="soloScreen" hidden>
    <div id="soloTop">
      <div id="soloTimerBadge">⏱ <span id="soloTimerNum">--</span></div>
      <div id="soloScoreLine">
        <span id="soloSessionScore">本次 0 / 0</span>
        <span id="soloTotalScore">累計 0 / 0</span>
      </div>
    </div>

    <div id="soloStatusLine"></div>

    <div id="soloQuestionCard">
      <div id="soloPromptLabel"></div>
      <div id="soloPromptText"></div>
    </div>

    <div id="soloChoices">
      <button class="choiceBtn" data-idx="0"><span class="choiceKey">1</span><span class="choiceText"></span></button>
      <button class="choiceBtn" data-idx="1"><span class="choiceKey">2</span><span class="choiceText"></span></button>
      <button class="choiceBtn" data-idx="2"><span class="choiceKey">3</span><span class="choiceText"></span></button>
      <button class="choiceBtn" data-idx="3"><span class="choiceKey">4</span><span class="choiceText"></span></button>
    </div>

    <button id="soloEndBtn">結束練習</button>
  </section>

  <footer id="appVersion"></footer>

  <script src="data/version.js"></script>
  <script src="src/lib/romanize.js"></script>
  <script src="data/questions.js"></script>
  <script src="src/lib/curated-words.js"></script>
  <script src="src/lib/questions.js"></script>
  <script src="src/game-state.js"></script>
  <script src="src/solo-state.js"></script>
  <script src="src/solo-stats.js"></script>
  <script src="src/keyboard.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/settings.js"></script>
  <script src="src/theme.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
